[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiveflow"
version = "0.1.0"
description = "HiveFlow local asset decision system"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "click>=8.1,<8.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
hiveflow = "hiveflow.cli:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hiveflow"]
