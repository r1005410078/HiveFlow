[package]
name = "hf-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
comfy-table = "7"
textplots = "0.8"
ratatui = "0.29"
crossterm = "0.29"
indicatif = "0.17"
ctrlc = "3"

[dev-dependencies]
mockito = "1"
