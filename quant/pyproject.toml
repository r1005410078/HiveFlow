[project]
name = "hiveflow"
version = "0.1.0"
description = "HiveFlow Quant Core"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=16.0.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "scipy>=1.17.1",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveflow", "src/domain", "src/application", "src/interfaces"]
